name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Roswell
        env:
          LISP: sbcl-bin/2.5.0
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          ros --version
          ros install rove

      - name: Assert the core system does not pull in check-it
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          ros run --eval '(ql:quickload :cl-spec :silent t)' \
                  --eval '(uiop:quit (if (find-package "CHECK-IT") 1 0))'

      - name: Compile from a cold cache with warnings visible
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          # No quickload here: this must be the first thing that touches
          # cl-spec in this process. Quickloading cl-spec and then
          # force-compiling it in that same already-loaded image would
          # redefine every generic function and method the load just
          # defined, burying a real warning under ~100
          # REDEFINITION-WITH-DEFGENERIC/DEFMETHOD ones. ASDF resolves
          # cl-spec through CL_SOURCE_REGISTRY on its own, so compile-system
          # here compiles straight into a fresh, cold fasl cache.
          ros run --eval '(asdf:compile-system :cl-spec :force :all)' \
                  --eval '(uiop:quit 0)'

      - name: Run tests
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: rove cl-spec.asd

      - name: Check ASDF propagates a failed test
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          ros run --eval '(ql:quickload :cl-spec/tests :silent t)' \
                  --eval '(asdf:test-system :cl-spec)' \
                  --load ci/asdf-test-failure.lisp \
                  --eval '(uiop:quit 0)'

  ccl-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clozure CL 1.12.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 -o ccl.tar.gz \
            https://github.com/Clozure/ccl/releases/download/v1.12.2/ccl-1.12.2-linuxx86.tar.gz
          echo "a94fda3daf26ce8c3d08e0db0e6e9907995acc10e0f8aad2125790b93eaa1556  ccl.tar.gz" | sha256sum -c -
          tar -xzf ccl.tar.gz

      - name: Load the core and exercise a range and a multiple-value contract
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          "$RUNNER_TEMP/ccl/lx86cl64" --image-name "$RUNNER_TEMP/ccl/lx86cl64.image" \
            --no-init --batch --eval '(require :asdf)' --eval '(asdf:load-system "cl-spec")' \
            --load ci/core-smoke.lisp
