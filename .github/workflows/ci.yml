name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sbcl: ['2.1.10', '2.5.0']
    env:
      CL_SPEC_CI_SBCL_VERSION: ${{ matrix.sbcl }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Roswell
        env:
          # Roswell's current dump code needs newer SBCL internals.
          LISP: sbcl-bin/2.5.0
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: |
          ros --version
          ros install rove
          if [ "$CL_SPEC_CI_SBCL_VERSION" != 2.5.0 ]; then
            ros install "sbcl-bin/$CL_SPEC_CI_SBCL_VERSION"
          fi
          ros -L "sbcl-bin/$CL_SPEC_CI_SBCL_VERSION" run \
              --eval '(assert (string= (lisp-implementation-version)
                                        (uiop:getenv "CL_SPEC_CI_SBCL_VERSION")))' \
              --eval '(uiop:quit 0)'

      - name: Assert the core system does not pull in check-it
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          ros -L "sbcl-bin/$CL_SPEC_CI_SBCL_VERSION" run --eval '(sb-ext:disable-debugger)' \
                  --eval '(ql:quickload :cl-spec :silent t)' \
                  --eval '(uiop:quit (if (find-package "CHECK-IT") 1 0))'

      - name: Compile from a cold cache with warnings visible
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          # No quickload here: this must be the first thing that touches
          # cl-spec in this process. Quickloading cl-spec and then
          # force-compiling it in that same already-loaded image would
          # redefine every generic function and method the load just
          # defined, burying a real warning under ~100
          # REDEFINITION-WITH-DEFGENERIC/DEFMETHOD ones. ASDF resolves
          # cl-spec through CL_SOURCE_REGISTRY on its own, so compile-system
          # here compiles straight into a fresh, cold fasl cache.
          ros -L "sbcl-bin/$CL_SPEC_CI_SBCL_VERSION" run --eval '(sb-ext:disable-debugger)' \
                  --eval '(asdf:compile-system :cl-spec :force :all)' \
                  --eval '(uiop:quit 0)'

      - name: Run tests
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: ros -L "sbcl-bin/$CL_SPEC_CI_SBCL_VERSION" "$HOME/.roswell/bin/rove" cl-spec.asd

      - name: Check ASDF propagates a failed test
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          ros -L "sbcl-bin/$CL_SPEC_CI_SBCL_VERSION" run --eval '(sb-ext:disable-debugger)' \
                  --eval '(ql:quickload :cl-spec/tests :silent t)' \
                  --eval '(asdf:test-system :cl-spec)' \
                  --load ci/asdf-test-failure.lisp \
                  --eval '(uiop:quit 0)'

      - name: Run the real-range tests on CLISP
        if: matrix.sbcl == '2.5.0'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clisp
          ql_dir="$HOME/.roswell/lisp/quicklisp"
          export CL_SOURCE_REGISTRY="$GITHUB_WORKSPACE//:$ql_dir/dists/quicklisp/software//:"
          run_ranges() {
            mode="$1"
            shift
            XDG_CACHE_HOME="$RUNNER_TEMP/clisp-$mode" clisp "$@" -norc -q \
              -i "$ql_dir/asdf.lisp" \
              -x '(setf *load-verbose* nil *compile-verbose* nil)' \
              -x '(asdf:load-system "cl-spec/tests/backends/real-range-checks")' \
              -x '(cl-spec/tests/backends/real-range-checks:run-real-range-checks)'
          }
          run_ranges default
          run_ranges ansi -ansi

      - name: Run the function case guard regressions on ECL
        if: matrix.sbcl == '2.5.0'
        run: |
          sudo apt-get install -y ecl
          ql_dir="$HOME/.roswell/lisp/quicklisp"
          export CL_SOURCE_REGISTRY="$GITHUB_WORKSPACE//:$HOME/.roswell/local-projects//:$ql_dir/dists/quicklisp/software//:"
          ecl -norc -eval '(require :asdf)' \
              -eval '(asdf:load-system "cl-spec/tests/function-cases-test")' \
              -eval '(in-package :cl-spec/tests/function-cases-test)' \
              -eval '(uiop:quit
                       (if (rove:run-tests
                            (quote (case-guards-reject-their-own-return-bindings
                                    loop-and-prog-guards-use-their-own-bindings
                                    standard-guard-macros-respect-return-scope
                                    guard-local-bindings-and-data-are-independent-of-the-outcome
                                    a-local-result-is-available-in-a-case-guard
                                    common-lisp-argument-names-do-not-hide-the-return-value
                                    case-guards-accept-foreign-result-variables
                                    guard-check-respects-local-macro-syntax
                                    guard-macros-expand-once-and-cannot-introduce-output-references
                                    case-guard-check-sees-enclosing-symbol-macros
                                    owning-contract-validates-programmatic-guard-references
                                    programmatic-guards-accept-foreign-result-variables
                                    programmatic-guards-reserve-the-declaration-packages-result
                                    registration-keeps-lexical-guard-analysis-until-the-guard-changes
                                    attached-case-edits-respect-each-current-owner))
                            :style :dot) 0 1))'

  ccl-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Clozure CL 1.12.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 -o ccl.tar.gz \
            https://github.com/Clozure/ccl/releases/download/v1.12.2/ccl-1.12.2-linuxx86.tar.gz
          echo "a94fda3daf26ce8c3d08e0db0e6e9907995acc10e0f8aad2125790b93eaa1556  ccl.tar.gz" | sha256sum -c -
          tar -xzf ccl.tar.gz

      - name: Load the core and exercise a range and a multiple-value contract
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          "$RUNNER_TEMP/ccl/lx86cl64" --image-name "$RUNNER_TEMP/ccl/lx86cl64.image" \
            --no-init --batch --eval '(require :asdf)' --eval '(asdf:load-system "cl-spec")' \
            --load ci/core-smoke.lisp
