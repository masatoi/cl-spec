name: API docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Roswell
        env:
          LISP: sbcl-bin/2.5.0
        run: |
          curl -L https://raw.githubusercontent.com/roswell/roswell/master/scripts/install-for-ci.sh | sh
          echo "$HOME/.roswell/bin" >> "$GITHUB_PATH"

      # Generation fails when any public symbol lacks a docstring, so this job
      # also enforces the completeness the reference promises.
      - name: Generate the API reference
        env:
          CL_SOURCE_REGISTRY: "${{ github.workspace }}//:"
        run: |
          ros run --eval '(ql:quickload :cl-spec/api-docs :silent t)' \
                  --eval '(cl-spec/api-docs:generate-api-docs)' \
                  --eval '(uiop:quit 0)'

      - name: Commit the regenerated reference
        run: |
          if git diff --quiet -- docs/api; then
            echo "API reference is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git commit -m "docs: regenerate API reference"
          git push
